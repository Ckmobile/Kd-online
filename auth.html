<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK ONLINE SHOPPING - Account</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <button onclick="goBack()" class="back-arrow-btn"><i class="fas fa-arrow-left"></i></button>
        <div class="logo">UK ONLINE SHOPPING</div>
    </header>

    <main class="container auth-container">
        <div id="login-box" class="auth-box">
            <h2>Customer Login</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="btn-auth">Login</button>
            </form>
            <p><a href="#" onclick="toggleAuthReset()">Forgot Password?</a></p>
            <button id="google-login" class="btn-google"><i class="fab fa-google"></i> Sign in with Google</button>
            <p>Don't have an account? <a href="#" onclick="toggleAuthBox()">Register Here</a></p>
        </div>

        <div id="register-box" class="auth-box hidden">
            <h2>Create Account</h2>
            <form id="register-form">
                <input type="text" id="reg-name" placeholder="Full Name" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit" class="btn-auth">Register</button>
            </form>
            <p>Already have an account? <a href="#" onclick="toggleAuthBox()">Login Here</a></p>
        </div>

        <div id="reset-box" class="auth-box hidden">
            <h2>Reset Password</h2>
            <form id="reset-form">
                <input type="email" id="reset-email" placeholder="Enter your Email" required>
                <button type="submit" class="btn-auth">Send Reset Link</button>
            </form>
            <p><a href="#" onclick="toggleAuthReset()">Back to Login</a></p>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
