<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK ONLINE SHOPPING - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <button onclick="goBack()" class="back-arrow-btn"><i class="fas fa-arrow-left"></i></button>
        <div class="logo">UK ONLINE SHOPPING - ADMIN</div>
    </header>

    <div id="admin-auth" class="container auth-container">
        <div class="auth-box">
            <h2>Admin Login</h2>
            <form id="admin-login-form">
                <input type="email" id="admin-email" placeholder="Admin Email" required>
                <input type="password" id="admin-password" placeholder="Admin Password" required>
                <button type="submit" class="btn-auth">Verify & Enter</button>
            </form>
        </div>
    </div>

    <main id="admin-dashboard" class="container hidden">
        <div class="admin-tabs">
            <button onclick="switchTab('upload-tab')" class="tab-btn active">Upload Product</button>
            <button onclick="switchTab('orders-tab')" class="tab-btn">View Orders</button>
            <button onclick="switchTab('manage-items-tab')" class="tab-btn">Manage Items</button>
        </div>

        <section id="upload-tab" class="tab-content">
            <h3>Add New Product</h3>
            <form id="upload-form">
                <input type="text" id="prod-name" placeholder="Product Name" required>
                <input type="text" id="prod-category" placeholder="Category (e.g., Grocery, Electronics)" required>
                <input type="number" id="prod-price" placeholder="Price" required>
                <textarea id="prod-desc" placeholder="Product Description" required></textarea>
                <label>Product Image:</label>
                <input type="file" id="prod-image" accept="image/*" required>
                <button type="submit" class="btn-submit">Upload to Shop</button>
            </form>
        </section>

        <section id="orders-tab" class="tab-content hidden">
            <h3>Customer Orders Details</h3>
            <div id="orders-list">
                </div>
        </section>

        <section id="manage-items-tab" class="tab-content hidden">
            <h3>All Uploaded Items</h3>
            <div id="admin-items-grid" class="admin-items-list">
                </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
